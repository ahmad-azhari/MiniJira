{% extends "base.html" %}

{% block titulo %}Editar Usuario - {{ usuario.nombre_usuario }}{% endblock %}

{% block contenido %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="card">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">✏️ Editar Usuario: {{ usuario.nombre_usuario }}</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('usuarios_bp.editar', usuario_id=usuario.id) }}">
                    <div class="mb-3">
                        <label for="nombre_usuario" class="form-label">Nombre de usuario:</label>
                        <input type="text" class="form-control" id="nombre_usuario" name="nombre_usuario" value="{{ usuario.nombre_usuario }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email:</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ usuario.email }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="nueva_contrasena" class="form-label">Nueva Contraseña (dejar vacío para mantener la actual):</label>
                        <input type="password" class="form-control" id="nueva_contrasena" name="nueva_contrasena">
                    </div>

                    {% if es_admin %}
                        <div class="mb-3">
                            <label for="roles" class="form-label">Roles:</label>
                            <div class="form-check">
                                {% for rol in roles %}
                                    <input class="form-check-input" type="checkbox" name="roles" value="{{ rol.id }}" id="rol_{{ rol.id }}"
                                        {% if rol in usuario.roles %}checked{% endif %}>
                                    <label class="form-check-label" for="rol_{{ rol.id }}">
                                        {{ rol.nombre }}
                                    </label>
                                    <br>
                                {% endfor %}
                            </div>
                        </div>
                    {% endif %}

                    <div class="mt-4">
                        <button type="submit" class="btn btn-warning">💾 Guardar Cambios</button>
                        <a href="{{ url_for('usuarios_bp.perfil', usuario_id=usuario.id) }}" class="btn btn-secondary">← Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
