{% extends "base.html" %}

{% block titulo %}Crear Usuario - Mini Jira{% endblock %}

{% block contenido %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">➕ Crear Nuevo Usuario</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('usuarios_bp.crear') }}">
                    <div class="mb-3">
                        <label for="nombre_usuario" class="form-label">Nombre de usuario:</label>
                        <input type="text" class="form-control" id="nombre_usuario" name="nombre_usuario" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email:</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="contrasena" class="form-label">Contraseña:</label>
                        <input type="password" class="form-control" id="contrasena" name="contrasena" required>
                    </div>

                    <div class="mb-3">
                        <label for="roles" class="form-label">Roles:</label>
                        <div class="form-check">
                            {% for rol in roles %}
                                <input class="form-check-input" type="checkbox" name="roles" value="{{ rol.id }}" id="rol_{{ rol.id }}">
                                <label class="form-check-label" for="rol_{{ rol.id }}">
                                    {{ rol.nombre }}
                                </label>
                                <br>
                            {% endfor %}
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">✅ Crear Usuario</button>
                        <a href="{{ url_for('usuarios_bp.indice') }}" class="btn btn-secondary">← Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
