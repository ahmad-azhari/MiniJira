{% extends "base.html" %}

{% block titulo %}Editar Resultado - Mini Jira{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h1>Editar Resultado</h1>

        <form method="POST" class="mt-4">
            <div class="mb-3">
                <label for="estado" class="form-label">Estado *</label>
                <select class="form-select" id="estado" name="estado" required>
                    <option value="pasado" {% if resultado.estado.value == 'pasado' %}selected{% endif %}>Pasado</option>
                    <option value="fallido" {% if resultado.estado.value == 'fallido' %}selected{% endif %}>Fallido</option>
                    <option value="bloqueado" {% if resultado.estado.value == 'bloqueado' %}selected{% endif %}>Bloqueado</option>
                    <option value="en_progreso" {% if resultado.estado.value == 'en_progreso' %}selected{% endif %}>En Progreso</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="notas" class="form-label">Notas</label>
                <textarea class="form-control" id="notas" name="notas" rows="4">{{ resultado.notas or '' }}</textarea>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-warning"> Guardar Cambios</button>
                <a href="{{ url_for('resultados_bp.detalle', resultado_id=resultado.id) }}" class="btn btn-secondary"> Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
