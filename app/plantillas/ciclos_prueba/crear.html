{% extends "base.html" %}

{% block titulo %}Crear Ciclo de Prueba - Mini Jira{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h1>Crear Nuevo Ciclo de Prueba</h1>

        <form method="POST" class="mt-4">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre del Ciclo *</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required>
            </div>

            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea class="form-control" id="descripcion" name="descripcion" rows="4"></textarea>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary"> Crear Ciclo</button>
                <a href="{{ url_for('ciclos_prueba_bp.indice') }}" class="btn btn-secondary"> Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
